<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExaGuru — Marketing &amp; Operations Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue-50:#eef4ff; --blue-100:#dbe7ff; --blue-500:#2f6fed; --blue-600:#2159d6; --blue-700:#1a46ab;
  --amber-50:#fff7e6; --amber-500:#e8a317; --amber-700:#93650b;
  --green-50:#eafaf1; --green-500:#1ea363; --green-700:#0f6e42;
  --red-50:#fdeceb; --red-500:#e0483f; --red-700:#a72e27;
  --grey-50:#f6f7f9; --grey-100:#eef0f3; --grey-200:#e3e6eb; --grey-300:#cdd2da;
  --ink-900:#12151c; --ink-700:#3a3f4b; --ink-500:#6b7280; --ink-400:#9198a3;
  --white:#ffffff;
  --radius:14px; --radius-sm:9px;
  --shadow-sm:0 1px 2px rgba(18,21,28,.04), 0 1px 1px rgba(18,21,28,.03);
  --shadow-md:0 6px 20px rgba(18,21,28,.06), 0 2px 6px rgba(18,21,28,.04);
  --font-display:'Manrope',sans-serif; --font-body:'Inter',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body); background:var(--white); color:var(--ink-900);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; letter-spacing:-.01em;}
p{margin:0;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:13.5px;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--grey-300); border-radius:8px;}

/* ---------- layout ---------- */
#app{display:flex; min-height:100vh;}
.sidebar{
  width:230px; flex:none; background:var(--white); border-right:1px solid var(--grey-200);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
}
.brand{display:flex; align-items:center; gap:10px; padding:20px 18px 16px;}
.brand-mark{
  width:34px; height:34px; border-radius:10px; background:linear-gradient(155deg,var(--blue-500),var(--blue-700));
  display:flex; align-items:center; justify-content:center; flex:none;
}
.brand-mark svg{width:19px; height:19px;}
.brand-name{font-family:var(--font-display); font-weight:800; font-size:16.5px; line-height:1.1;}
.brand-sub{font-size:10px; color:var(--ink-400); font-weight:600; letter-spacing:.04em; text-transform:uppercase; margin-top:2px;}
.nav{flex:1; padding:6px 12px; overflow-y:auto;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:10px; color:var(--ink-700);
  font-size:13.6px; font-weight:600; cursor:pointer; margin-bottom:2px; border:1px solid transparent;
}
.nav-item svg{width:17px; height:17px; flex:none; opacity:.75;}
.nav-item:hover{background:var(--grey-50);}
.nav-item.active{background:var(--blue-50); color:var(--blue-700); border-color:var(--blue-100);}
.nav-item.active svg{opacity:1;}
.sidebar-foot{padding:14px 18px; border-top:1px solid var(--grey-200); font-size:11px; color:var(--ink-400); font-weight:500;}

.main{flex:1; min-width:0; background:var(--grey-50); min-height:100vh;}
.topbar{
  position:sticky; top:0; z-index:20; background:rgba(255,255,255,.92); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--grey-200); display:flex; align-items:center; gap:14px; padding:12px 26px;
}
.topbar-title{flex:none;}
.topbar-title h1{font-size:19px; font-weight:800;}
.topbar-title .date-line{font-size:12px; color:var(--ink-500); font-weight:600; margin-top:1px;}
.search-wrap{flex:1; max-width:380px; margin-left:14px; position:relative;}
.search-wrap input{
  width:100%; padding:8px 12px 8px 32px; border-radius:10px; border:1px solid var(--grey-200); background:var(--grey-50);
  font-size:13px; outline:none;
}
.search-wrap input:focus{border-color:var(--blue-500); background:var(--white);}
.search-wrap svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--ink-400);}
.topbar-actions{margin-left:auto; display:flex; align-items:center; gap:10px;}
.icon-btn{
  width:36px; height:36px; border-radius:10px; border:1px solid var(--grey-200); background:var(--white);
  display:flex; align-items:center; justify-content:center; position:relative;
}
.icon-btn svg{width:17px; height:17px; color:var(--ink-700);}
.icon-btn .dot{position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--red-500); border:1.5px solid var(--white);}
.btn{
  border-radius:10px; border:1px solid var(--grey-200); background:var(--white); padding:8px 14px;
  font-size:13px; font-weight:700; color:var(--ink-700); display:inline-flex; align-items:center; gap:6px;
}
.btn:hover{background:var(--grey-50);}
.btn-primary{background:var(--blue-500); border-color:var(--blue-500); color:#fff;}
.btn-primary:hover{background:var(--blue-600);}
.btn-danger{color:var(--red-700); border-color:var(--red-50); background:var(--red-50);}
.btn-sm{padding:5px 10px; font-size:12px; border-radius:8px;}
.btn svg{width:14px; height:14px;}

.content{padding:22px 26px 90px;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
.section-head h2{font-size:17px; font-weight:800;}
.section-head .sub{font-size:12.5px; color:var(--ink-500); margin-top:2px; font-weight:500;}

/* ---------- cards / grid ---------- */
.grid{display:grid; gap:14px;}
.grid-5{grid-template-columns:repeat(5,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1200px){.grid-5{grid-template-columns:repeat(3,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:760px){.grid-5,.grid-3,.grid-2{grid-template-columns:1fr;}}

.card{
  background:var(--white); border:1px solid var(--grey-200); border-radius:var(--radius); box-shadow:var(--shadow-sm);
  padding:16px;
}
.stat-card{position:relative; overflow:hidden;}
.stat-card .stat-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.stat-card .stat-label{font-size:11.5px; font-weight:700; color:var(--ink-500); text-transform:uppercase; letter-spacing:.03em;}
.stat-card .stat-icon{width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center;}
.stat-card .stat-icon svg{width:15px; height:15px;}
.stat-card .stat-value{font-family:var(--font-display); font-size:26px; font-weight:800;}
.stat-card .stat-foot{font-size:11.5px; color:var(--ink-400); margin-top:4px; font-weight:600;}

/* signature: ring progress */
.ring-wrap{position:relative; width:54px; height:54px; flex:none;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-bg{fill:none; stroke:var(--grey-200); stroke-width:5;}
.ring-fg{fill:none; stroke:var(--blue-500); stroke-width:5; stroke-linecap:round; transition:stroke-dashoffset .4s;}
.ring-label{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; font-family:var(--font-display);}

/* badges */
.badge{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:100px; font-size:11px; font-weight:700; letter-spacing:.02em; text-transform:uppercase; border:1px solid transparent; white-space:nowrap;}
.badge .bdot{width:6px; height:6px; border-radius:50%;}
.badge-amber{background:var(--amber-50); color:var(--amber-700);}
.badge-amber .bdot{background:var(--amber-500);}
.badge-blue{background:var(--blue-50); color:var(--blue-700);}
.badge-blue .bdot{background:var(--blue-500);}
.badge-green{background:var(--green-50); color:var(--green-700);}
.badge-green .bdot{background:var(--green-500);}
.badge-red{background:var(--red-50); color:var(--red-700);}
.badge-red .bdot{background:var(--red-500);}
.badge-grey{background:var(--grey-100); color:var(--ink-500);}
.badge-grey .bdot{background:var(--ink-400);}

.pill{padding:4px 10px; border-radius:100px; font-size:11.5px; font-weight:700; border:1px solid var(--grey-200); background:var(--white); color:var(--ink-500); cursor:pointer;}
.pill.active{background:var(--ink-900); color:#fff; border-color:var(--ink-900);}
.pill-row{display:flex; gap:6px; flex-wrap:wrap;}

/* alerts */
.alert{display:flex; gap:10px; align-items:flex-start; padding:11px 13px; border-radius:11px; border:1px solid; margin-bottom:8px; font-size:12.8px;}
.alert svg{width:16px; height:16px; flex:none; margin-top:1px;}
.alert-red{background:var(--red-50); border-color:#f5c9c5; color:var(--red-700);}
.alert-amber{background:var(--amber-50); border-color:#f3dca4; color:var(--amber-700);}
.alert-blue{background:var(--blue-50); border-color:var(--blue-100); color:var(--blue-700);}
.alert b{font-weight:800;}
.alert .a-sub{color:inherit; opacity:.8; font-weight:500;}

/* task rows */
.list{background:var(--white); border:1px solid var(--grey-200); border-radius:var(--radius); overflow:hidden;}
.task-row{display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--grey-100);}
.task-row:last-child{border-bottom:none;}
.task-row:hover{background:var(--grey-50);}
.chk{width:19px; height:19px; border-radius:6px; border:1.6px solid var(--grey-300); flex:none; display:flex; align-items:center; justify-content:center; cursor:pointer; background:#fff;}
.chk.checked{background:var(--green-500); border-color:var(--green-500);}
.chk svg{width:12px; height:12px; color:#fff; display:none;}
.chk.checked svg{display:block;}
.task-main{flex:1; min-width:0;}
.task-name{font-size:13.6px; font-weight:700; color:var(--ink-900);}
.task-name.done{text-decoration:line-through; color:var(--ink-400); font-weight:600;}
.task-meta{font-size:11.5px; color:var(--ink-500); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; font-weight:500;}
.task-meta span{display:inline-flex; align-items:center; gap:3px;}
.task-badges{display:flex; gap:6px; align-items:center; flex:none;}
.row-actions{display:flex; gap:4px; flex:none;}
.icon-btn-sm{width:28px; height:28px; border-radius:8px; border:1px solid var(--grey-200); background:#fff; display:flex; align-items:center; justify-content:center;}
.icon-btn-sm svg{width:13px; height:13px; color:var(--ink-500);}
.icon-btn-sm:hover{background:var(--grey-50);}

.empty{padding:40px 20px; text-align:center; color:var(--ink-400);}
.empty svg{width:34px; height:34px; margin-bottom:8px; opacity:.5;}
.empty .e-title{font-weight:700; color:var(--ink-700); font-size:13.5px;}
.empty .e-sub{font-size:12px; margin-top:3px;}

/* modal */
.modal-backdrop{position:fixed; inset:0; background:rgba(18,21,28,.45); z-index:100; display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; overflow-y:auto;}
.modal{background:#fff; border-radius:16px; width:560px; max-width:100%; box-shadow:0 20px 60px rgba(0,0,0,.25); overflow:hidden;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--grey-200);}
.modal-head h3{font-size:15.5px; font-weight:800;}
.modal-body{padding:18px 20px; max-height:70vh; overflow-y:auto;}
.modal-foot{padding:14px 20px; border-top:1px solid var(--grey-200); display:flex; justify-content:flex-end; gap:8px;}
.field{margin-bottom:13px;}
.field label{display:block; font-size:11.5px; font-weight:700; color:var(--ink-500); margin-bottom:5px; text-transform:uppercase; letter-spacing:.02em;}
.field input, .field select, .field textarea{
  width:100%; padding:9px 11px; border-radius:9px; border:1px solid var(--grey-200); outline:none; background:var(--grey-50);
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--blue-500); background:#fff;}
.field textarea{resize:vertical; min-height:60px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.close-x{width:28px; height:28px; border-radius:8px; border:none; background:var(--grey-100); display:flex; align-items:center; justify-content:center;}
.close-x svg{width:14px; height:14px;}

/* tabs */
.tab-bar{display:flex; gap:4px; background:var(--grey-100); padding:4px; border-radius:11px; width:fit-content; margin-bottom:16px;}
.tab-btn{padding:7px 14px; border-radius:8px; font-size:12.8px; font-weight:700; color:var(--ink-500); border:none; background:transparent;}
.tab-btn.active{background:#fff; color:var(--ink-900); box-shadow:var(--shadow-sm);}

/* course */
.course-card{cursor:pointer; transition:box-shadow .15s;}
.course-card:hover{box-shadow:var(--shadow-md);}
.progress-bar{height:7px; background:var(--grey-100); border-radius:100px; overflow:hidden; margin-top:6px;}
.progress-bar > div{height:100%; background:var(--blue-500); border-radius:100px;}
.progress-bar.green > div{background:var(--green-500);}
.checklist-item{display:flex; align-items:center; gap:9px; padding:6px 0; font-size:13px;}
.checklist-item .txt{flex:1;}
.checklist-item.done .txt{text-decoration:line-through; color:var(--ink-400);}
.mini-add{display:flex; gap:6px; margin-top:8px;}
.mini-add input{flex:1; padding:7px 10px; border-radius:8px; border:1px solid var(--grey-200); font-size:12.5px; background:var(--grey-50);}

.timeline{position:relative; padding-left:22px; margin-top:10px;}
.timeline:before{content:''; position:absolute; left:6px; top:4px; bottom:4px; width:2px; background:var(--grey-200);}
.tl-item{position:relative; padding-bottom:18px; cursor:pointer;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{position:absolute; left:-22px; top:1px; width:13px; height:13px; border-radius:50%; background:var(--grey-300); border:2px solid #fff; box-shadow:0 0 0 2px var(--grey-300);}
.tl-item.done .tl-dot{background:var(--green-500); box-shadow:0 0 0 2px var(--green-500);}
.tl-item.overdue .tl-dot{background:var(--red-500); box-shadow:0 0 0 2px var(--red-500);}
.tl-item.next .tl-dot{background:var(--blue-500); box-shadow:0 0 0 2px var(--blue-500);}
.tl-title{font-size:13px; font-weight:700;}
.tl-sub{font-size:11.5px; color:var(--ink-500); margin-top:2px; font-weight:500;}

/* kanban */
.kanban{display:flex; gap:12px; overflow-x:auto; padding-bottom:10px;}
.kcol{background:var(--grey-100); border-radius:14px; padding:10px; width:230px; flex:none; min-height:200px;}
.kcol-head{display:flex; align-items:center; justify-content:space-between; padding:2px 4px 10px;}
.kcol-head h4{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-500);}
.kcol-count{background:var(--white); border-radius:100px; font-size:11px; font-weight:700; padding:1px 7px; color:var(--ink-500);}
.kcard{background:#fff; border-radius:11px; padding:10px 11px; margin-bottom:8px; border:1px solid var(--grey-200); box-shadow:var(--shadow-sm); cursor:grab;}
.kcard:active{cursor:grabbing;}
.kcard .kc-title{font-size:12.6px; font-weight:700; margin-bottom:5px;}
.kcard .kc-meta{font-size:10.8px; color:var(--ink-500); display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-weight:600;}
.kcol.dragover{background:var(--blue-50);}

/* calendar */
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.cal-dow{font-size:10.5px; font-weight:800; color:var(--ink-400); text-align:center; text-transform:uppercase; padding-bottom:4px;}
.cal-cell{min-height:82px; border:1px solid var(--grey-200); border-radius:10px; padding:6px; background:#fff; cursor:pointer;}
.cal-cell:hover{border-color:var(--blue-500);}
.cal-cell.other{opacity:.35;}
.cal-cell.today{border-color:var(--blue-500); background:var(--blue-50);}
.cal-daynum{font-size:11.5px; font-weight:700; color:var(--ink-700);}
.cal-chip{background:var(--blue-500); color:#fff; font-size:9.5px; font-weight:700; padding:2px 5px; border-radius:5px; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.cal-chip.completed{background:var(--green-500);}
.cal-chip.cancelled{background:var(--red-500); text-decoration:line-through;}

.webinar-card{border:1px solid var(--grey-200); border-radius:14px; padding:15px; background:#fff; margin-bottom:12px;}
.webinar-card .wc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.wc-title{font-size:14.5px; font-weight:800;}
.wc-meta{font-size:12px; color:var(--ink-500); margin-top:5px; font-weight:600; display:flex; gap:12px; flex-wrap:wrap;}
.wc-meta span{display:inline-flex; align-items:center; gap:4px;}
.wc-actions{display:flex; gap:7px; margin-top:12px; flex-wrap:wrap;}

/* table */
table.data-table{width:100%; border-collapse:collapse; font-size:12.8px;}
table.data-table th{text-align:left; font-size:10.8px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-400); font-weight:800; padding:8px 10px; border-bottom:2px solid var(--grey-200);}
table.data-table td{padding:11px 10px; border-bottom:1px solid var(--grey-100); vertical-align:top;}
table.data-table tr:last-child td{border-bottom:none;}

.metric-input-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-top:10px;}
.bar-chart{display:flex; align-items:flex-end; gap:10px; height:120px; padding-top:10px;}
.bar-chart .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
.bar-chart .bar{width:60%; background:var(--blue-500); border-radius:6px 6px 0 0; min-height:2px;}
.bar-chart .bar-lbl{font-size:10.5px; font-weight:700; color:var(--ink-500); margin-top:6px;}

/* fab */
.fab-wrap{position:fixed; right:28px; bottom:28px; z-index:50;}
.fab{
  width:54px; height:54px; border-radius:16px; background:var(--blue-500); color:#fff; border:none;
  display:flex; align-items:center; justify-content:center; box-shadow:0 10px 24px rgba(47,111,237,.4);
}
.fab svg{width:24px; height:24px; transition:transform .2s;}
.fab.open svg{transform:rotate(45deg);}
.fab-menu{position:absolute; bottom:64px; right:0; background:#fff; border:1px solid var(--grey-200); border-radius:14px; box-shadow:var(--shadow-md); padding:6px; width:190px; display:none;}
.fab-menu.open{display:block;}
.fab-menu-item{display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:9px; font-size:12.8px; font-weight:700; color:var(--ink-700);}
.fab-menu-item:hover{background:var(--grey-50);}
.fab-menu-item svg{width:15px; height:15px; color:var(--blue-500);}

/* notif dropdown */
.dropdown{position:absolute; top:44px; right:0; width:330px; background:#fff; border:1px solid var(--grey-200); border-radius:14px; box-shadow:var(--shadow-md); z-index:60; display:none; max-height:420px; overflow-y:auto; padding:8px;}
.dropdown.open{display:block;}
.dd-head{font-size:11.5px; font-weight:800; color:var(--ink-500); text-transform:uppercase; padding:8px 8px 6px;}

.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink-900); color:#fff; padding:10px 18px; border-radius:10px; font-size:13px; font-weight:600; z-index:200; box-shadow:var(--shadow-md); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

.demo-tag{background:var(--ink-900); color:#fff; font-size:9.5px; font-weight:800; padding:2px 7px; border-radius:5px; letter-spacing:.04em;}

.how-box{background:var(--blue-50); border:1px solid var(--blue-100); border-radius:14px; padding:18px 20px; margin-bottom:16px;}
.how-box h4{font-size:14px; margin-bottom:8px;}
.how-box ol{margin:0; padding-left:18px; font-size:13px; line-height:1.9; color:var(--ink-700);}

@media(max-width:900px){
  .sidebar{position:fixed; left:-240px; z-index:90; transition:left .2s; box-shadow:var(--shadow-md);}
  .sidebar.open{left:0;}
  .search-wrap{display:none;}
  .content{padding:16px;}
  .field-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 17V7l8-4 8 4v10l-8 4-8-4Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M4 7l8 4 8-4M12 11v10" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <div class="brand-name">ExaGuru</div>
        <div class="brand-sub">Elevate Your IT Career</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">exaguru.official · v1.0</div>
  </aside>

/* Storage layer: uses the Claude.ai artifact "window.storage" API when this file is
   viewed inside a Claude.ai artifact (so it persists to your account), and automatically
   falls back to the browser's own localStorage when the file is opened directly
   (double-clicked, or opened via file:// / a local server) — which is the normal case
   once you've downloaded this dashboard. Either way, a refresh never loses your data. */
const hasCloudStorage = (typeof window !== 'undefined') && !!window.storage && typeof window.storage.get === 'function';

async function storageGet(key){
  if(hasCloudStorage){
    try{ const r = await window.storage.get(key); if(r) return r; }catch(e){ /* fall through to localStorage */ }
  }
  try{
    const v = localStorage.getItem(key);
    return v!==null ? {key, value:v} : null;
  }catch(e){ return null; }
}
async function storageSet(key, value){
  if(hasCloudStorage){
    try{ const r = await window.storage.set(key, value); if(r) return r; }catch(e){ /* fall through to localStorage */ }
  }
  try{ localStorage.setItem(key, value); return {key, value}; }
  catch(e){ console.error('localStorage save failed', e); toast('Could not save — your browser may be blocking local storage'); return null; }
}

async function loadState(){
  try{
    const res = await storageGet(STORAGE_KEY);
    if(res && res.value){ state = JSON.parse(res.value); }
    else { state = demoState(); }
  }catch(e){ state = demoState(); }
  if(!state.ui) state.ui = {activeTab:'dashboard', taskFilter:'ALL', taskSearch:'', webinarView:'agenda', calMonth:new Date().getMonth(), calYear:new Date().getFullYear(), openCourseId:null};
  if(!state.analyticsLog) state.analyticsLog = {linkedin:[], instagram:[], youtube:[], webinar:[]};
  if(!state.socialOverrides) state.socialOverrides = {linkedin:'', instagram:'', youtubeShorts:'', youtubeLong:''};
}
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    await storageSet(STORAGE_KEY, JSON.stringify(state));
  }, 250);
}

/* ============================= HELPERS ============================= */
function badge(text, colorClass){
  colorClass = colorClass || STATUS_COLOR[text] || 'grey';
  return `<span class="badge badge-${colorClass}"><span class="bdot"></span>${text}</span>`;
}
function fmtDateNice(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-US',{day:'2-digit',month:'short',year:'numeric'});
}
function fmtTime(t){
  if(!t) return '';
  const [h,m] = t.split(':').map(Number);
  const ap = h>=12?'PM':'AM'; let hh = h%12; if(hh===0) hh=12;
  return `${hh}:${pad(m)} ${ap}`;
}
function daysBetween(iso){
  if(!iso) return null;
  const a = new Date(todayISO()+'T00:00:00'); const b = new Date(iso+'T00:00:00');
  return Math.round((b-a)/86400000);
}
function isOverdue(iso, done){ if(!iso||done) return false; return daysBetween(iso)<0; }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function ring(pct, size=54, stroke=5){
  pct = Math.max(0, Math.min(100, Math.round(pct||0)));
  const r = (size-stroke)/2, c = 2*Math.PI*r, off = c - (pct/100)*c;
  return `<div class="ring-wrap" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}"/><circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg><div class="ring-label">${pct}%</div></div>`;
}

/* ============================= ALERTS ============================= */
function computeAlerts(){
  const alerts = [];
  state.tasks.forEach(t=>{
    if(t.status!=='COMPLETED' && t.date && isOverdue(t.date,false)){
      alerts.push({level:'red', title:'Task overdue', sub:`${t.name} · was due ${fmtDateNice(t.date)}`});
    }
  });
  state.webinars.forEach(w=>{
    if(w.status==='CANCELLED'||w.status==='COMPLETED') return;
    const d = daysBetween(w.date);
    if(d===0) alerts.push({level:'red', title:'Webinar today', sub:`${w.title} · ${fmtTime(w.startTime)} IST`});
    else if(d===1) alerts.push({level:'amber', title:'Webinar tomorrow', sub:`${w.title} · ${fmtTime(w.startTime)} IST`});
  });
  state.courses.forEach(c=>{
    MILESTONE_STAGES.forEach(s=>{
      const m = c.milestones[s.key];
      if(!m) return;
      if(m.planned && !m.done){
        const d = daysBetween(m.planned);
        if(d<0) alerts.push({level:'red', title:`Milestone overdue — ${c.name}`, sub:`${s.label} was due ${fmtDateNice(m.planned)}`});
        else if(d<=2) alerts.push({level:'amber', title:`Milestone due soon — ${c.name}`, sub:`${s.label} in ${d} day${d===1?'':'s'}`});
      }
    });
    (c.labs||[]).forEach(l=>{ if(l.status==='NOT STARTED' && c.milestones.labComplete && c.milestones.labComplete.planned){
      const d = daysBetween(c.milestones.labComplete.planned);
      if(d!==null && d<0) alerts.push({level:'amber', title:`Lab overdue — ${c.name}`, sub:`${l.name} not yet started`});
    }});
    if(c.launchDate){
      const d = daysBetween(c.launchDate);
      if(d!==null && d>=0 && d<=7 && c.status!=='LIVE' && c.status!=='COMPLETED') alerts.push({level:'blue', title:'Course launch approaching', sub:`${c.name} launches in ${d} day${d===1?'':'s'}`});
    }
  });
  state.content.forEach(k=>{
    if(k.date===todayISO() && k.publishingStatus!=='PUBLISHED') alerts.push({level:'blue', title:'Content scheduled today', sub:`${k.title} · ${k.platform}`});
    if(k.date && daysBetween(k.date)<=1 && daysBetween(k.date)>=0 && k.creativeStatus!=='READY'){
      alerts.push({level:'amber', title:'Content not ready', sub:`${k.title} is still "${k.creativeStatus}"`});
    }
  });
  return alerts;
}

  const weekStart = new Date(); weekStart.setDate(weekStart.getDate()-weekStart.getDay());
  const weekTasks = state.tasks.filter(t=>{ if(!t.date) return false; const d=new Date(t.date+'T00:00:00'); return d>=weekStart; });

  let nextLaunch = null;
  state.courses.forEach(c=>{ if(c.launchDate && daysBetween(c.launchDate)>=0 && (!nextLaunch || c.launchDate<nextLaunch.launchDate)) nextLaunch=c; });

  const alerts = computeAlerts();

  const stats = [

    {label:'In Progress', value: inProgress, icon:'clock', color:'amber', foot:'across all tasks'},

    {label:'Active Courses', value: activeCourses, icon:'courses', color:'amber', foot:`${state.courses.length} total`},

/* ============================= TASKS ============================= */
function taskRow(t){
  const done = t.status==='COMPLETED';
  const overdue = isOverdue(t.date, done);
  return `
  <div class="task-row">
    <div class="chk ${done?'checked':''}" onclick="toggleTaskDone('${t.id}')">${ICONS.check}</div>
    <div class="task-main">
      <div class="task-name ${done?'done':''}">${esc(t.name)}</div>
      <div class="task-meta">
        ${t.date?`<span>${ICONS.cal}${fmtDateNice(t.date)}${overdue?' · <b style="color:var(--red-500)">overdue</b>':''}</span>`:''}
        ${t.time?`<span>${ICONS.clock}${fmtTime(t.time)}</span>`:''}
        <span>${esc(t.platform||'—')}</span>
        <span>${esc(t.category||'—')}</span>
      </div>
    </div>
    <div class="task-badges">${badge(t.priority,STATUS_COLOR[t.priority])}${badge(t.status)}</div>
    <div class="row-actions">
      <div class="icon-btn-sm" onclick="openTaskModal('${t.id}')">${ICONS.edit}</div>
      <div class="icon-btn-sm" onclick="deleteItem('tasks','${t.id}')">${ICONS.trash}</div>
    </div>
  </div>`;
}
function renderTasks(){
  const f = state.ui.taskFilter, q = (state.ui.taskSearch||'').toLowerCase();
  let list = state.tasks.slice().sort((a,b)=> (a.date||'9999').localeCompare(b.date||'9999'));
  if(f==='TODAY') list = list.filter(t=>t.date===todayISO());
  else if(f==='OVERDUE') list = list.filter(t=>isOverdue(t.date, t.status==='COMPLETED'));
  else if(['HOLD','IN PROGRESS','COMPLETED'].includes(f)) list = list.filter(t=>t.status===f);
  if(q) list = list.filter(t=> (t.name||'').toLowerCase().includes(q) || (t.notes||'').toLowerCase().includes(q) || (t.platform||'').toLowerCase().includes(q) || (t.category||'').toLowerCase().includes(q));

  const filters = ['ALL','TODAY','OVERDUE','HOLD','IN PROGRESS','COMPLETED'];
  return `
  <div class="section-head">
    <div><h2>Daily To-Do</h2><div class="sub">${state.tasks.length} total tasks</div></div>
    <button class="btn btn-primary" onclick="openTaskModal()">${ICONS.plus} Add Task</button>
  </div>
  <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;">
    <div class="pill-row">${filters.map(fl=>`<div class="pill ${state.ui.taskFilter===fl?'active':''}" onclick="setTaskFilter('${fl}')">${fl}</div>`).join('')}</div>
    <div class="search-wrap" style="max-width:240px; margin-left:auto;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input placeholder="Search tasks…" value="${esc(state.ui.taskSearch||'')}" oninput="setTaskSearch(this.value)">
    </div>
  </div>
  <div class="list">
    ${list.length ? list.map(t=>taskRow(t)).join('') : `<div class="empty">${ICONS.tasks}<div class="e-title">No tasks match this view</div><div class="e-sub">Try a different filter or add a new task.</div></div>`}
  </div>
  `;
}
function setTaskFilter(f){ state.ui.taskFilter=f; render(); }
function setTaskSearch(v){ state.ui.taskSearch=v; render(); }
function toggleTaskDone(id){
  const t = state.tasks.find(x=>x.id===id); if(!t) return;
  t.status = t.status==='COMPLETED' ? 'IN PROGRESS' : 'COMPLETED';
  saveState(); render();
}
function openTaskModal(id){
  const t = id ? state.tasks.find(x=>x.id===id) : {name:'',date:todayISO(),time:'',platform:'LinkedIn',category:'Content',priority:'MEDIUM',status:'HOLD',notes:''};
  const isEdit = !!id;
  showModal(`
    <div class="modal-head"><h3>${isEdit?'Edit Task':'Add Task'}</h3><button class="close-x" onclick="closeModal()">${ICONS.plus}</button></div>
    <div class="modal-body">
      <div class="field"><label>Task Name</label><input id="f_name" value="${esc(t.name)}" placeholder="e.g. Design carousel page 3"></div>
      <div class="field-row">
        <div class="field"><label>Date</label><input type="date" id="f_date" value="${t.date||''}"></div>
        <div class="field"><label>Time</label><input type="time" id="f_time" value="${t.time||''}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Platform</label><select id="f_platform">${PLATFORMS.map(p=>`<option ${t.platform===p?'selected':''}>${p}</option>`).join('')}</select></div>
        <div class="field"><label>Category</label><select id="f_category">${CATEGORIES.map(c=>`<option ${t.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Priority</label><select id="f_priority">${PRIORITIES.map(p=>`<option ${t.priority===p?'selected':''}>${p}</option>`).join('')}</select></div>
        <div class="field"><label>Status</label><select id="f_status">${TASK_STATUSES.map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>Notes</label><textarea id="f_notes" placeholder="Optional notes">${esc(t.notes)}</textarea></div>
    </div>
    <div class="modal-foot">
      ${isEdit?`<button class="btn btn-danger" onclick="deleteItem('tasks','${id}'); closeModal();">Delete</button>`:''}
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveTask('${id||''}')">Save Task</button>
    </div>
  `);
}
function saveTask(id){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ toast('Task name is required'); return; }
  const data = {
    name, date:document.getElementById('f_date').value, time:document.getElementById('f_time').value,
    platform:document.getElementById('f_platform').value, category:document.getElementById('f_category').value,
    priority:document.getElementById('f_priority').value, status:document.getElementById('f_status').value,
    notes:document.getElementById('f_notes').value
  };
  if(id){ Object.assign(state.tasks.find(t=>t.id===id), data); }
  else { data.id = uid(); state.tasks.push(data); }
  saveState(); closeModal(); render(); toast('Task saved');
}

/* ============================= COURSES ============================= */
function courseProgress(c){
  const mods = c.modules||[], labs = c.labs||[];
  const modPct = mods.length? 100*mods.filter(m=>m.status==='COMPLETED').length/mods.length : 0;
  const labPct = labs.length? 100*labs.filter(l=>l.status==='COMPLETED').length/labs.length : 0;
  return {modPct, labPct};
}
function renderCourses(){
  if(state.ui.openCourseId){
    const c = state.courses.find(x=>x.id===state.ui.openCourseId);
    if(c) return renderCourseDetail(c);
    state.ui.openCourseId = null;
  }
  return `
  <div class="section-head">
    <div><h2>Course Plan</h2><div class="sub">${state.courses.length} course${state.courses.length===1?'':'s'} tracked</div></div>

        <div style="margin-top:14px; font-size:11.5px; font-weight:700; color:var(--ink-500);">MODULE PROGRESS · ${Math.round(modPct)}%</div>

        <div style="margin-top:10px; font-size:11.5px; font-weight:700; color:var(--ink-500);">LAB PROGRESS · ${Math.round(labPct)}%</div>

function moduleRow(courseId, kind, item){
  const cls = item.status==='COMPLETED'?'green':(item.status==='IN PROGRESS'?'blue':'grey');
  return `
  <div style="display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--grey-100)">
    <div style="flex:1; font-size:13px; font-weight:600;">${esc(item.name)}</div>
    <select style="font-size:11px; padding:4px 6px; border-radius:7px; border:1px solid var(--grey-200); font-weight:700;" onchange="setSubStatus('${courseId}','${kind}','${item.id}',this.value)">
      ${['NOT STARTED','IN PROGRESS','COMPLETED'].map(s=>`<option ${item.status===s?'selected':''}>${s}</option>`).join('')}

    <div class="icon-btn-sm" onclick="removeSubItem('${courseId}','${kind}','${item.id}')">${ICONS.trash}</div>

function addSubItem(courseId, kind){
  const inputId = kind==='modules'?'newModuleName':'newLabName';
  const val = document.getElementById(inputId).value.trim();
  if(!val) return;
  const c = state.courses.find(x=>x.id===courseId);
  c[kind].push({id:uid(), name:val, status:'NOT STARTED'});
  saveState(); render();
}
function setSubStatus(courseId, kind, itemId, status){
  const c = state.courses.find(x=>x.id===courseId);
  const item = c[kind].find(i=>i.id===itemId); item.status = status;
  saveState(); render();
}
function removeSubItem(courseId, kind, itemId){
  const c = state.courses.find(x=>x.id===courseId);
  c[kind] = c[kind].filter(i=>i.id!==itemId);
  saveState(); render();
}
function renderTimeline(c){
  let nextFound = false;
  return MILESTONE_STAGES.map(s=>{
    const m = c.milestones[s.key] || {planned:'',done:''};
    const overdue = isOverdue(m.planned, m.done);
    const isNext = !m.done && !nextFound && (nextFound = true);
    let cls = m.done ? 'done' : (overdue ? 'overdue' : (isNext?'next':''));
    let sub = '';
    if(m.done) sub = `Completed ${fmtDateNice(m.done)}`;
    else if(m.planned){ const d = daysBetween(m.planned); sub = d<0 ? `${Math.abs(d)} day${Math.abs(d)===1?'':'s'} overdue` : `Planned ${fmtDateNice(m.planned)} · ${d} day${d===1?'':'s'} away`; }
    else sub = 'No date set';
    return `
    <div class="tl-item ${cls}" onclick="openMilestoneModal('${c.id}','${s.key}')">
      <div class="tl-dot"></div>
      <div class="tl-title">${s.label}</div>
      <div class="tl-sub">${sub}</div>
    </div>`;
  }).join('');
}
function openMilestoneModal(courseId, key){
  const c = state.courses.find(x=>x.id===courseId);
  const m = c.milestones[key] || {planned:'',done:''};
  const label = MILESTONE_STAGES.find(s=>s.key===key).label;
  showModal(`
    <div class="modal-head"><h3>${label}</h3><button class="close-x" onclick="closeModal()">${ICONS.plus}</button></div>
    <div class="modal-body">
      <div class="field"><label>Planned Date</label><input type="date" id="m_planned" value="${m.planned||''}"></div>
      <div class="field"><label>Completed Date</label><input type="date" id="m_done" value="${m.done||''}"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveMilestone('${courseId}','${key}')">Save</button>
    </div>
  `);
}
function saveMilestone(courseId, key){
  const c = state.courses.find(x=>x.id===courseId);
  c.milestones[key] = {planned:document.getElementById('m_planned').value, done:document.getElementById('m_done').value};
  saveState(); closeModal(); render();
}
function openCourseModal(id){

function saveCourse(id){
  const name = document.getElementById('c_name').value.trim();
  if(!name){ toast('Course name is required'); return; }

/* ============================= WEBINARS ============================= */
function renderWebinars(){
  const views = ['month','week','agenda'];
  return `
  <div class="section-head">
    <div><h2>Webinar Calendar</h2><div class="sub">${state.webinars.length} webinar${state.webinars.length===1?'':'s'} tracked</div></div>
    <button class="btn btn-primary" onclick="openWebinarModal(null,'${todayISO()}')">${ICONS.plus} Add Webinar</button>
  </div>
  <div class="tab-bar">${views.map(v=>`<button class="tab-btn ${state.ui.webinarView===v?'active':''}" onclick="setWebinarView('${v}')">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</div>
  ${state.ui.webinarView==='month' ? renderWebinarMonth() : renderWebinarAgenda(state.ui.webinarView==='week')}
  `;
}
function setWebinarView(v){ state.ui.webinarView=v; render(); }
function renderWebinarMonth(){
  const y = state.ui.calYear, m = state.ui.calMonth;
  const first = new Date(y,m,1); const startOffset = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const monthName = first.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-cell other"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${y}-${pad(m+1)}-${pad(d)}`;
    const isToday = iso===todayISO();
    const webs = state.webinars.filter(w=>w.date===iso);
    cells += `<div class="cal-cell ${isToday?'today':''}" onclick="openWebinarModal(null,'${iso}')">
      <div class="cal-daynum">${d}</div>
      ${webs.map(w=>`<div class="cal-chip ${w.status==='COMPLETED'?'completed':''} ${w.status==='CANCELLED'?'cancelled':''}" onclick="event.stopPropagation(); openWebinarDetail('${w.id}')">${esc(w.title)}</div>`).join('')}
    </div>`;
  }
  const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return `
  <div class="card">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
      <button class="icon-btn-sm" onclick="shiftMonth(-1)">&larr;</button>
      <h3 style="font-size:14.5px">${monthName}</h3>
      <button class="icon-btn-sm" onclick="shiftMonth(1)">&rarr;</button>
    </div>
    <div class="cal-grid">
      ${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
  </div>`;
}
function shiftMonth(delta){

}
function renderWebinarAgenda(weekOnly){
  let list = state.webinars.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  if(weekOnly){
    const start = new Date(); start.setDate(start.getDate()-start.getDay());
    const end = new Date(start); end.setDate(end.getDate()+6);
    list = list.filter(w=>{ if(!w.date) return false; const d=new Date(w.date+'T00:00:00'); return d>=start && d<=end; });
  }
  if(!list.length) return `<div class="empty">${ICONS.webinars}<div class="e-title">No webinars ${weekOnly?'this week':'scheduled'}</div><div class="e-sub">Click "Add Webinar" to plan your next session.</div></div>`;

}

function analyticsCard(key){
  const conf = ANALYTICS_FIELDS[key];
  const log = state.analyticsLog[key]||[];
  const latest = log[log.length-1];
  return `
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
      <h3 style="font-size:14.5px">${conf.label}</h3>
      <span style="font-size:11px; color:var(--ink-400); font-weight:600;">${log.length} entr${log.length===1?'y':'ies'}</span>
    </div>
    ${!log.length ? `<div class="empty" style="padding:24px 0">${ICONS.analytics}<div class="e-title">No data yet</div><div class="e-sub">Add your metrics.</div></div>` : `
      <div class="bar-chart">
        ${log.slice(-6).map(e=>{
          const max = Math.max(...log.slice(-6).map(x=>Number(x[conf.fields[0]])||0),1);
          const h = Math.max(4, 100*((Number(e[conf.fields[0]])||0)/max));
          return `<div class="bar-col"><div class="bar" style="height:${h}%"></div><div class="bar-lbl">${e.date.slice(5)}</div></div>`;
        }).join('')}
      </div>
      <div style="font-size:11px; color:var(--ink-500); margin-top:4px; font-weight:600;">${conf.fields[0]} over last ${Math.min(6,log.length)} entries</div>
    `}
    <div class="metric-input-grid">
      <input type="date" id="a_${key}_date" value="${todayISO()}" style="padding:8px 9px; border-radius:8px; border:1px solid var(--grey-200); font-size:12.5px; grid-column:1/-1;">
      ${conf.fields.map(f=>`<input type="number" id="a_${key}_${f}" placeholder="${f}">`).join('')}
    </div>
    <button class="btn btn-sm btn-primary" style="margin-top:10px" onclick="addAnalyticsEntry('${key}')">${ICONS.plus} Log Entry</button>
    ${latest? `<div style="font-size:11px; color:var(--ink-400); margin-top:8px;">Last logged ${fmtDateNice(latest.date)}</div>`:''}
  </div>`;
}
function addAnalyticsEntry(key){
  const conf = ANALYTICS_FIELDS[key];
  const entry = {date: document.getElementById(`a_${key}_date`).value || todayISO()};
  let hasVal = false;
  conf.fields.forEach(f=>{ const v = document.getElementById(`a_${key}_${f}`).value; entry[f]=v; if(v!=='') hasVal=true; });
  if(!hasVal){ toast('Enter at least one metric'); return; }
  state.analyticsLog[key].push(entry);
  saveState(); render(); toast('Metrics logged');
}

function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=`exaguru-dashboard-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast('Backup downloaded');
}
function importData(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.tasks || !parsed.courses){ toast('Invalid backup file'); return; }
      state = parsed;
      if(!state.ui) state.ui = {activeTab:'dashboard', taskFilter:'ALL', taskSearch:'', webinarView:'agenda', calMonth:new Date().getMonth(), calYear:new Date().getFullYear(), openCourseId:null};
      saveState(); render(); toast('Data imported');
    }catch(e){ toast('Could not read file'); }
  };
  reader.readAsText(file);
}
function resetDemo(){
  if(!confirm('This will delete all your data and restore the demo dataset. Continue?')) return;
  state = demoState(); saveState(); render(); toast('Demo data restored');
}

/* ============================= SHARED: delete, modal, fab, notif, search ============================= */
function deleteItem(kind, id){
  if(!confirm('Delete this item? This cannot be undone.')) return;
  state[kind] = state[kind].filter(x=>x.id!==id);
  saveState(); render(); toast('Deleted');
}
function showModal(html){
  document.getElementById('modalRoot').innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this) closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

function toggleFab(){
  document.getElementById('fabBtn').classList.toggle('open');
  document.getElementById('fabMenu').classList.toggle('open');
}
function renderFabMenu(){
  const items = [
    {label:'Add Task', icon:'tasks', fn:"openQuickAdd('task')"},
    {label:'Add Course', icon:'courses', fn:"openQuickAdd('course')"},
    {label:'Add Webinar', icon:'webinars', fn:"openQuickAdd('webinar')"},
    {label:'Add Content', icon:'content', fn:"openQuickAdd('content')"},
    {label:'Add Milestone', icon:'cal', fn:"openQuickAdd('milestone')"},
  ];
  document.getElementById('fabMenu').innerHTML = items.map(i=>`<div class="fab-menu-item" onclick="${i.fn}">${ICONS[i.icon]}${i.label}</div>`).join('');
}
function openQuickAdd(type){
  document.getElementById('fabBtn').classList.remove('open');
  document.getElementById('fabMenu').classList.remove('open');
  if(type==='task') openTaskModal();
  else if(type==='course') openCourseModal();
  else if(type==='webinar') openWebinarModal();
  else if(type==='content') openContentModal();
  else if(type==='milestone'){
    if(!state.courses.length){ toast('Add a course first'); return; }
    const c = state.courses[0];
    openMilestoneModal(c.id, MILESTONE_STAGES.find(s=>!c.milestones[s.key].done).key || MILESTONE_STAGES[0].key);
  }
}

function toggleNotif(ev){
  ev.stopPropagation();
  const dd = document.getElementById('notifDropdown');
  const opening = !dd.classList.contains('open');
  dd.classList.toggle('open');
  if(opening){
    const alerts = computeAlerts();
    dd.innerHTML = `<div class="dd-head">Notifications (${alerts.length})</div>` +
      (alerts.length? alerts.map(a=>`<div class="alert alert-${a.level}" style="margin:4px 6px">${ICONS.warn}<div><b>${esc(a.title)}</b><div class="a-sub">${esc(a.sub)}</div></div></div>`).join('')
      : `<div class="empty" style="padding:24px 10px">${ICONS.check}<div class="e-title">All caught up</div></div>`);
  }
}
document.addEventListener('click', (e)=>{
  const dd = document.getElementById('notifDropdown');
  if(dd && !dd.contains(e.target) && !e.target.closest('.icon-btn')) dd.classList.remove('open');
});
function renderNotifBadge(){
  const n = computeAlerts().length;
  document.getElementById('notifDot').style.display = n? 'block':'none';
}

let searchDebounce=null;
function onGlobalSearch(v){
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(()=>{
    if(!v){ return; }
    if(state.ui.activeTab==='tasks'){ state.ui.taskSearch=v; render(); return; }
    // jump to tasks with search applied for a unified experience
    state.ui.activeTab='tasks'; state.ui.taskFilter='ALL'; state.ui.taskSearch=v; render();
  }, 300);
}

document.getElementById('menuBtn').addEventListener('click', ()=>document.getElementById('sidebar').classList.toggle('open'));
function initResponsiveMenu(){
  if(window.innerWidth<=900) document.getElementById('menuBtn').style.display='flex';
}

/* ============================= INIT ============================= */
(async function init(){
  await loadState();
  initResponsiveMenu();
  render();
})();
</script>
</body>
</html>
